name: Apply fixups merge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download merged sources
        run: |
          curl -fsSL -o hanhua_v3/runtime/install_hanhua.py \
            "https://litter.catbox.moe/bdg14w.py"
          curl -fsSL -o hanhua_v3/runtime/taiwan_fixups.py \
            "https://litter.catbox.moe/w2t6fw.py"
          wc -c hanhua_v3/runtime/install_hanhua.py hanhua_v3/runtime/taiwan_fixups.py
          python3 -c "import ast; ast.parse(open('hanhua_v3/runtime/install_hanhua.py',encoding='utf-8').read()); ast.parse(open('hanhua_v3/runtime/taiwan_fixups.py',encoding='utf-8').read()); print('syntax ok')"
          grep -q 'from .taiwan_fixups import TAIWAN_SIMPLIFY_FIXUPS' hanhua_v3/runtime/install_hanhua.py
          grep -q '("登錄", "登录")' hanhua_v3/runtime/taiwan_fixups.py
          ! grep -q 'TAIWAN_SIMPLIFY_FIXUPS = (' hanhua_v3/runtime/install_hanhua.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hanhua_v3/runtime/install_hanhua.py hanhua_v3/runtime/taiwan_fixups.py
          git commit -m "refactor: single-source TAIWAN_SIMPLIFY_FIXUPS in taiwan_fixups.py" || exit 0
          git push
