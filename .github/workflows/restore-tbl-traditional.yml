name: Restore Traditional Chinese tbl_overrides

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Traditional Chinese TSV
        run: |
          curl -fsSL -o legacy/reports/tbl_overrides.backup_before_source_refresh_20260613_003712.tsv \
            "https://litter.catbox.moe/bowo0t.txt"
          wc -c legacy/reports/tbl_overrides.backup_before_source_refresh_20260613_003712.tsv
          head -5 legacy/reports/tbl_overrides.backup_before_source_refresh_20260613_003712.tsv

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy/reports/tbl_overrides.backup_before_source_refresh_20260613_003712.tsv
          git status
          git commit -m "chore: convert da7795e tbl_overrides.backup to Traditional Chinese (2549 cells)" || exit 0
          git push
