name: Validate Taiwan encoding

on:
  push:
    paths:
      - "hanhua_v3/runtime/**"
      - "data/**"
      - "build_output.py"
      - ".github/workflows/fix-encoding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate UTF-8 Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          roots = [Path("hanhua_v3"), Path("build_output.py")]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(root.rglob("*.py"))
          for path in files:
              text = path.read_text(encoding="utf-8")
              ast.parse(text, filename=str(path))
          print(f"validated {len(files)} Python files")
          PY
      - name: Validate translation tables
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ("data/translations.tsv", "data/new_translations.tsv"):
              path = Path(name)
              if not path.exists():
                  continue
              with path.open("r", encoding="utf-8-sig", newline="") as f:
                  rows = list(csv.reader(f, delimiter="\t"))
              if rows:
                  width = len(rows[0])
                  bad = [i + 1 for i, row in enumerate(rows[1:], 2) if len(row) != width]
                  if bad:
                      raise SystemExit(f"{name}: inconsistent TSV columns at lines {bad[:10]}")
              print(f"validated {name}")
          PY
