name: Restore fixups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full table
        run: |
          curl -fsSL -o hanhua_v3/runtime/taiwan_fixups.py "https://litter.catbox.moe/lxu9a9.py"
          python3 -c "import ast; ast.parse(open('hanhua_v3/runtime/taiwan_fixups.py',encoding='utf-8').read()); print('syntax ok', open('hanhua_v3/runtime/taiwan_fixups.py',encoding='utf-8').read().count('(\"'))"
          ! grep -q '(\"重新整理\", \"刷新\")' hanhua_v3/runtime/taiwan_fixups.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hanhua_v3/runtime/taiwan_fixups.py
          git commit -m "fix: full taiwan_fixups without 刷新→重新整理 expansion" || exit 0
          git push
